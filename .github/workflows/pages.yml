name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run checks
        run: |
          uv run --frozen pytest
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src

      - name: Build site with the latest Migri data
        run: >-
          uv run --frozen migri-stats
          --csv reports/migri-stats.csv
          --html reports/migri-stats.html

      - name: Commit updated report
        run: |
          git add reports/migri-stats.csv reports/migri-stats.html
          if git diff --cached --quiet; then
            echo "The checked-in report is already current."
            exit 0
          fi

          latest_month="$(tail -n 1 reports/migri-stats.csv | cut -d, -f1 | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update Migri statistics through ${latest_month}"
          git push

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp reports/migri-stats.csv _site/migri-stats.csv
          cp reports/migri-stats.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
